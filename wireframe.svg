      <text x="210" y="180" text-anchor="middle" font-size="16" font-weight="700">NAV • Home | Projects | About</text>
      <rect x="18" y="216" width="384" height="173" rx="6" fill="#f7f7f4" stroke="#8b979d"/>
      <text x="210" y="248" text-anchor="middle" font-size="18" font-weight="700">WELCOME SECTION</text><text x="210" y="282" text-anchor="middle" font-size="14">Intro paragraph</text><text x="210" y="310" text-anchor="middle" font-size="14">What I’m learning (h3)</text><text x="210" y="339" text-anchor="middle" font-size="14">Short paragraph</text>
      <rect x="18" y="404" width="384" height="155" rx="6" fill="#f7f7f4" stroke="#8b979d"/>
      <text x="210" y="437" text-anchor="middle" font-size="18" font-weight="700">INTERESTS SECTION</text><text x="210" y="473" text-anchor="middle" font-size="14">Bulleted list of interests</text><text x="210" y="501" text-anchor="middle" font-size="14">Technology • Music • Projects</text>
      <rect x="18" y="574" width="384" height="54" rx="6" fill="#d9e7ee" stroke="#66808e"/>
      <text x="210" y="608" text-anchor="middle" font-size="15">FOOTER • copyright</text>
    </g>
    <g transform="translate(540 125)">
