      <rect x="0" y="22" width="420" height="630" rx="12" fill="#fff" stroke="#6b7d87" stroke-width="2"/>
      <rect x="18" y="40" width="384" height="90" rx="6" fill="#d9e7ee" stroke="#66808e"/>
      <text x="210" y="77" text-anchor="middle" font-size="18" font-weight="700">HEADER</text><text x="210" y="104" text-anchor="middle" font-size="14">Page title + short intro</text>
      <rect x="18" y="145" width="384" height="56" rx="6" fill="#e9e2d5" stroke="#8c806c"/>
      <text x="210" y="180" text-anchor="middle" font-size="16" font-weight="700">NAV • Home | Projects | About</text>
      <rect x="18" y="216" width="384" height="266" rx="6" fill="#f7f7f4" stroke="#8b979d"/>
