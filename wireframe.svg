<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
  <title id="title">Damien Alderete portfolio site wireframe plan</title>
  <desc id="desc">Three simple page wireframes for Home, Projects, and About and Contact, with a proposed color palette and font choices.</desc>
  <rect width="1500" height="1020" fill="#f5f2ec"/>
  <text x="750" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172d3d">Portfolio Site Plan — Damien Alderete</text>
  <text x="750" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#435563">Rough layout sketch • three pages • content shown as labeled blocks</text>

  <g font-family="Arial, sans-serif" fill="#172d3d">
