      <rect x="38" y="360" width="344" height="76" rx="5" fill="#fff" stroke="#a3adb1"/><text x="210" y="391" text-anchor="middle" font-size="15" font-weight="700">Project card 2</text><text x="210" y="416" text-anchor="middle" font-size="13">Name + description</text>
      <rect x="18" y="497" width="384" height="62" rx="6" fill="#f7f7f4" stroke="#8b979d"/><text x="210" y="535" text-anchor="middle" font-size="16" font-weight="700">CREATIVE WORK • music</text>
      <rect x="18" y="574" width="384" height="54" rx="6" fill="#d9e7ee" stroke="#66808e"/><text x="210" y="608" text-anchor="middle" font-size="15">FOOTER • copyright</text>
    </g>
    <g transform="translate(1025 125)">
      <text x="210" y="0" text-anchor="middle" font-size="23" font-weight="700">ABOUT / CONTACT</text>
      <rect x="0" y="22" width="420" height="630" rx="12" fill="#fff" stroke="#6b7d87" stroke-width="2"/>
      <rect x="18" y="40" width="384" height="90" rx="6" fill="#d9e7ee" stroke="#66808e"/>
      <text x="210" y="77" text-anchor="middle" font-size="18" font-weight="700">HEADER</text><text x="210" y="104" text-anchor="middle" font-size="14">Page title + short intro</text>
      <rect x="18" y="145" width="384" height="56" rx="6" fill="#e9e2d5" stroke="#8c806c"/>
      <text x="210" y="180" text-anchor="middle" font-size="16" font-weight="700">NAV • Home | Projects | About</text>
      <rect x="18" y="216" width="384" height="207" rx="6" fill="#f7f7f4" stroke="#8b979d"/>
      <text x="210" y="249" text-anchor="middle" font-size="18" font-weight="700">ABOUT ME</text><text x="210" y="284" text-anchor="middle" font-size="14">Short biography</text><text x="210" y="319" text-anchor="middle" font-size="14">Interests (h3)</text><text x="210" y="350" text-anchor="middle" font-size="14">Bulleted interests</text>
      <rect x="18" y="438" width="384" height="121" rx="6" fill="#f7f7f4" stroke="#8b979d"/>
      <text x="210" y="472" text-anchor="middle" font-size="18" font-weight="700">CONTACT</text><text x="210" y="510" text-anchor="middle" font-size="14">Contact information placeholder</text>
      <rect x="18" y="574" width="384" height="54" rx="6" fill="#d9e7ee" stroke="#66808e"/><text x="210" y="608" text-anchor="middle" font-size="15">FOOTER • copyright</text>
