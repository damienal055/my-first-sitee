  <rect x="55" y="815" width="1390" height="150" rx="12" fill="#fff" stroke="#6b7d87" stroke-width="2"/>
  <text x="85" y="855" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172d3d">Design notes</text>
  <text x="85" y="893" font-family="Arial, sans-serif" font-size="17" fill="#263d4b">Color palette: deep navy (#172D3D), soft blue (#D9E7EE), warm cream (#F5F2EC), white (#FFFFFF).</text>
  <text x="85" y="927" font-family="Arial, sans-serif" font-size="17" fill="#263d4b">Font choices: Arial for headings and body text; a clean, readable sans-serif style throughout.</text>
